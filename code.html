            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface font-body-md m-0 p-0 overflow-hidden relative min-h-screen flex flex-col justify-center items-center">
<!-- Fixed Background Image -->
<div class="fixed inset-0 w-full h-full z-[-1]">
<img alt="Immersive Background" class="fixed inset-0 w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAQF5Rdhj-NwXJlcM-Wcc1X88Ho5GXQr3q6bIFy3NWQAGh_SSiKotDbNcA-DkePTzTCJ3PrTAbO3Su0NumVjpydJ4Vj9OFz830RH1TGpZDLy5rViOP57sBb_DmCIsFBx53KloHZrzO3kgnYaEebEI9imv5tUrE21fhNl4TGE1uhvbdi6tgdV29MVJdFK-aFKgcsWlfdMVic8Rtb4XqCu2Adg0_T0VT5n2T6a96MwOljG79oGJXgiLNG"/>
<div class="absolute inset-0 bg-black/40"></div>
</div>
<!-- Main Content -->
<main class="relative z-10 w-full flex-1 flex flex-col items-center justify-center px-4 h-full">
<h1 class="font-display-lg text-display-lg text-primary text-glow drop-shadow-2xl text-center backdrop-blur-sm">सेक्स प्लेलिस्ट</h1>
</main>
<!-- Fixed Music Player -->
<div class="fixed bottom-0 w-full z-[100] bg-black/40 backdrop-blur-xl border-t border-white/10 h-[90px] flex items-center justify-between px-margin-desktop">
<!-- Track Info -->
<div class="flex items-center gap-4 w-1/3">
<div class="w-12 h-12 bg-surface-variant/50 backdrop-blur-md rounded border border-white/10 flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-primary/20 animate-pulse"></div>
<span class="material-symbols-outlined text-primary/70" data-icon="music_note">music_note</span>
</div>
<div>
<div class="font-label-md text-label-md text-on-surface mb-1 drop-shadow-md">Nocturne No. 1</div>
<div class="font-label-sm text-label-sm text-on-surface-variant drop-shadow-md">Artist</div>
</div>
</div>
<!-- Controls & Progress -->
<div class="flex flex-col items-center gap-2 w-1/3">
<div class="flex items-center gap-6 text-on-surface">
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="skip_previous">skip_previous</span></button>
<button class="w-10 h-10 rounded-full border border-primary text-primary flex items-center justify-center hover:bg-primary/20 transition-colors box-glow bg-black/30 backdrop-blur-sm">
<span class="material-symbols-outlined" data-icon="pause" data-weight="fill" style="font-variation-settings: 'FILL' 1;">pause</span>
</button>
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="skip_next">skip_next</span></button>
</div>
<div class="w-full flex items-center gap-3">
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-80 text-[10px] drop-shadow-md">1:24</span>
<div class="flex-1 h-1 bg-white/20 rounded-full overflow-hidden relative cursor-pointer backdrop-blur-sm">
<div class="absolute top-0 left-0 h-full w-1/3 bg-primary rounded-full box-glow"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant opacity-80 text-[10px] drop-shadow-md">4:08</span>
</div>
</div>
<!-- Extra Controls -->
<div class="flex justify-end items-center gap-4 w-1/3 text-on-surface">
<button class="hover:text-primary transition-colors"><span class="material-symbols-outlined" data-icon="volume_up">volume_up</span></button>
<div class="w-24 h-1 bg-white/20 rounded-full overflow-hidden relative cursor-pointer hidden md:block backdrop-blur-sm">
<div class="absolute top-0 left-0 h-full w-2/3 bg-primary rounded-full"></div>
</div>
<button class="hover:text-primary transition-colors ml-4"><span class="material-symbols-outlined" data-icon="queue_music">queue_music</span></button>
</div>
</div>
